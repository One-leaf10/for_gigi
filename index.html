<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"><style>body{margin:0;height:100vh;background:pink;overflow:hidden;touch-action:none}#b{position:absolute;bottom:20px;left:50%;font-size:50px}#ov{position:absolute;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center}</style></head><body><div id="b">🧺</div><div id="ov"><button id="play" style="padding:20px 40px;font-size:20px;border-radius:30px;border:0">JUGAR</button></div><script>let playing=false;let b=document.getElementById('b');document.getElementById('play').addEventListener('touchend',e=>{e.preventDefault();playing=true;document.getElementById('ov').style.display='none'});document.getElementById('play').addEventListener('click',()=>{playing=true;document.getElementById('ov').style.display='none'});function move(x){if(!playing)return;let m=window.innerWidth-b.offsetWidth;let p=Math.min(Math.max(0,x-b.offsetWidth/2),m);b.style.left=p+'px'}document.addEventListener('touchmove',e=>{e.preventDefault();move(e.touches[0].clientX)},{passive:false})</script></body></html>
