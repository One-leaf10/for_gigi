<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lluvia de buena suerte</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(#ff8fab,#ff4d6d);height:100vh;overflow:hidden;font-family:sans-serif;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
#top{display:flex;justify-content:space-between;position:absolute;top:0;width:100%;padding:12px 15px;color:white;font-weight:bold;font-size:18px;z-index:10;text-shadow:0 2px 5px rgba(0,0,0,.3)}
#basket{position:absolute;bottom:25px;left:50%;transform:translateX(-50%);font-size:52px;z-index:5;will-change:left}
.item{position:absolute;top:-60px;font-size:32px;user-select:none;animation:fall linear}
@keyframes fall{to{transform:translateY(115vh) rotate(360deg)}}
#overlay{position:absolute;inset:0;background:rgba(0,0,0,.55);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20;color:white;text-align:center;padding:20px}
#overlay h1{font-size:42px} #overlay p{margin-top:8px;font-size:18px;opacity:.9}
button{padding:14px 36px;font-size:19px;border:none;border-radius:30px;background:white;color:#ff4d6d;font-weight:bold;margin-top:18px;touch-action:manipulation}
#share{margin-top:12px;background:transparent;border:2px solid white;color:white;padding:10px 24px;font-size:15px;display:none}
.msg{position:absolute;color:white;font-weight:bold;text-shadow:0 2px 4px #000;animation:up 1s forwards;pointer-events:none}
@keyframes up{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-60px);opacity:0}}
</style>
</head>
<body>
<div id="top"><div id="score">❤️ 0</div><div id="best">Récord: 0</div><div id="lives">💔💔💔💔💔</div></div>
<div id="basket">🧺</div>

<div id="overlay">
<h1 id="title">Lluvia de buena suerte</h1>
<p id="sub">❤️ = +1 punto<br>⭐ = +5 + vida extra<br>💣 = -1 vida<br>Cada 20 pts más rápido</p>
<p id="final"></p>
<button id="playBtn">JUGAR</button>
<button id="share">COMPARTIR MI SCORE</button>
</div>

<script>
let score=0,lost=0,playing=false,best=localStorage.getItem('best_gigi')||0,level=1,basket=document.getElementById('basket'),interval;
document.getElementById('best').innerText='Récord: '+best;

function startGame(){
score=0;lost=0;level=1;playing=true;
document.getElementById('overlay').style.display='none';
document.getElementById('share').style.display='none';
updateUI(); clearInterval(interval);
spawnLoop();
}

function spawnLoop(){
clearInterval(interval);
let speed=Math.max(300, 700 - level*60);
interval=setInterval(createItem, speed);
}

function createItem(){
if(!playing) return;
let r=Math.random();
let type='heart';
if(r>0.85) type='bomb';
else if(r>0.70) type='star';
let el=document.createElement('div'); el.className='item';
if(type==='heart'){el.innerHTML='❤️'; el.dataset.type='heart'}
if(type==='star'){el.innerHTML='⭐'; el.dataset.type='star'; el.style.fontSize='38px'}
if(type==='bomb'){el.innerHTML='💣'; el.dataset.type='bomb'}
el.style.left=Math.random()*85+'vw';
el.style.animationDuration=(1.5+Math.random()*1.5)+'s';
document.body.appendChild(el);
let check=setInterval(()=>{
if(!playing){clearInterval(check); el.remove(); return;}
let er=el.getBoundingClientRect(); let br=basket.getBoundingClientRect();
if(er.bottom>br.top && er.left<br.right && er.right>br.left){
 if(type==='heart'){score+=1; popText('+1',er.left,er.top)}
 if(type==='star'){score+=5; lost=Math.max(0,lost-1); popText('+5 ✨',er.left,er.top)}
 if(type==='bomb'){lost+=1; popText('-1 💥',er.left,er.top)}
 updateUI(); el.remove(); clearInterval(check);
 if(score>0 && score%20===0){level++; spawnLoop(); popText('NIVEL '+level+'!',window.innerWidth/2,200)}
 navigator.vibrate && navigator.vibrate(type==='bomb'?150:30);
}
if(er.top>window.innerHeight){
 if(type==='heart') lost++;
 updateUI(); el.remove(); clearInterval(check);
 if(lost>=5) endGame();
}
},16);
setTimeout(()=>{el.remove(); clearInterval(check)},4000);
}

function popText(t,x,y){
let m=document.createElement('div'); m.className='msg'; m.innerText=t;
m.style.left=x+'px'; m.style.top=y+'px'; document.body.appendChild(m);
setTimeout(()=>m.remove(),1000);
}

function updateUI(){
document.getElementById('score').innerText='❤️ '+score+' Lv'+level;
let hearts='💔'.repeat(5-lost)+'🖤'.repeat(lost);
document.getElementById('lives').innerText=hearts;
let bg=['linear-gradient(#ff8fab,#ff4d6d)','linear-gradient(#ff7eb8,#7c4dff)','linear-gradient(#7c4dff,#4d1aff)','linear-gradient(#1a1a40,#000)'];
document.body.style.background=bg[Math.min(level-1,3)];
}

function endGame(){
playing=false; clearInterval(interval);
if(score>best){best=score; localStorage.setItem('best_gigi',best)}
document.getElementById('best').innerText='Récord: '+best;
document.getElementById('title').innerText=score>=best && score>0?'NUEVO RÉCORD!':'FIN';
document.getElementById('final').innerText='Atrapaste '+score+' |
