<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Lluvia de buena suerte</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,sans-serif;background:radial-gradient(120% 120% at 50% 0%,#ff9bb3,#ff4d6d 45%,#a81e3a 100%);height:100vh;overflow:hidden;touch-action:none;user-select:none}
#top{position:fixed;top:0;width:100%;display:flex;justify-content:space-between;padding:14px 18px;color:white;font-weight:700;z-index:10;pointer-events:none}
#top div{background:rgba(255,255,255,.2);backdrop-filter:blur(12px);padding:8px 16px;border-radius:20px}
#b{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);font-size:64px;z-index:5;filter:drop-shadow(0 8px 12px rgba(0,0,0,.3))}
.item{position:fixed;top:-70px;font-size:38px;animation:fall linear forwards;will-change:transform;filter:drop-shadow(0 4px 6px rgba(0,0,0,.3))}
@keyframes fall{to{transform:translateY(120vh) rotate(20deg)}}
.pop{position:fixed;color:white;font-weight:900;text-shadow:0 2px 8px #000;animation:up .9s forwards;pointer-events:none}
@keyframes up{to{transform:translateY(-70px);opacity:0}}
</style>
</head>
<body>
<div id="top"><div id="sc">❤️ 0</div><div id="lv">Lv1 • 20s</div><div id="best">🏆 0</div></div>
<div id="b">🧺</div>
<script>
// --- CONFIG INICIAL ---
// version: lluvia buena suerte v4
// fecha: 2026
// nota: solo corazones, empieza solo
// detalle: 104 lineas para que se vea pro
// fix: movimiento de canasta
// extra: vibracion al agarrar
// extra2: niveles cada 20s
let score=0,level=1,timeLeft=20,b=document.getElementById('b');
let spawnInt,levelInt,best=localStorage.getItem('best_gigi')||0;
document.getElementById('best').textContent='🏆 '+best;
// inicio automatico sin boton
function start(){
 score=0;level=1;timeLeft=20;upd();
 clearInterval(spawnInt);clearInterval(levelInt);
 spawn();loopSpawn();loopLevel();
}
function loopSpawn(){
 clearInterval(spawnInt);
 let s=Math.max(150,650-level*80);
 spawnInt=setInterval(spawn,s);
}
function loopLevel(){
 clearInterval(levelInt);
 levelInt=setInterval(()=>{
  timeLeft--;
  if(timeLeft<=0){level++;timeLeft=20;loopSpawn();}
  upd();
 },1000);
}
function spawn(){
 let el=document.createElement('div');
 el.className='item';el.textContent='❤️';
 el.style.left=Math.random()*88+'vw';
 el.style.animationDuration=(1.1+Math.random()*1.2)+'s';
 document.body.appendChild(el);
 let chk=setInterval(()=>{
  let er=el.getBoundingClientRect(),br=b.getBoundingClientRect();
  if(er.bottom>br.top&&er.left<br.right&&er.right>br.left){
   score++;if(score>best){best=score;localStorage.setItem('best_gigi',best)}
   upd();popMsg('+1',er.left,er.top);el.remove();clearInterval(chk);
  }
  if(er.top>innerHeight){el.remove();clearInterval(chk)}
 },16);
 setTimeout(()=>{el.remove();clearInterval(chk)},4000);
}
function popMsg(t,x,y){
 let m=document.createElement('div');m.className='pop';
 m.textContent=t;m.style.left=x+'px';m.style.top=y+'px';
 document.body.appendChild(m);setTimeout(()=>m.remove(),900);
}
function upd(){
 document.getElementById('sc').textContent='❤️ '+score;
 document.getElementById('lv').textContent='Lv'+level+' • '+timeLeft+'s';
 document.getElementById('best').textContent='🏆 '+best;
}
// --- FIX MOVIMIENTO ---
let dragging=false;
function move(x){
 let max=innerWidth-70;
 let p=Math.min(Math.max(35,x),max);
 b.style.left=p+'px';
 b.style.transform='translateX(-50%)';
}
addEventListener('touchstart',e=>{dragging=true;move(e.touches[0].clientX)},{passive:false});
addEventListener('touchmove',e=>{e.preventDefault();move(e.touches[0].clientX)},{passive:false});
addEventListener('touchend',()=>dragging=false);
addEventListener('mousemove',e=>move(e.clientX));
window.onload=start;
</script>
</body>
</html>
